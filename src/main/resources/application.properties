spring.application.name=spring
server.port=${PORT:5005}

# Database - PostgreSQL (variables Render)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.maximum-pool-size=2

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Configuration Brevo
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=https://api.brevo.com/v3

# Application Email Settings
app.email.from=${APP_EMAIL_FROM:vinaassociationmadagascar@gmail.com}
app.email.team=${APP_EMAIL_TEAM:vinaassociationmadagascar@gmail.com}
app.name=VINA Association

# Session configuration²
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}